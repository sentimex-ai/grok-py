worker_processes  1;
events { worker_connections  1024; }

http {
  upstream pygrok_pool {
    # by service name & DNS, compose load-balances these four
    server pygrok:8000;  # first container
    server pygrok:8000;  # second
    server pygrok:8000;  # third
    server pygrok:8000;  # fourth
    server pygrok:8000;  # fifth
    server pygrok:8000;  # sixth
    server pygrok:8000;  # seventh
  }

  server {
    listen 80;
    location / {
      proxy_pass http://pygrok_pool;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
