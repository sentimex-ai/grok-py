apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.appName }}
  replicas: {{ .Values.replicas }}
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}
        protected: "true"
    spec:
      containers:
        - name: {{ .Values.appName }}
          image: {{ .Values.image }}
          env:
            - name: ENVIRONMENT
              value: {{ .Values.env }}
          ports:
            - containerPort: {{ .Values.port }}
          readinessProbe:
            httpGet:
              path: {{ .Values.healthCheckPath }}
              port: {{ .Values.port }}
            initialDelaySeconds: 10      # give it 10s to spin up
            timeoutSeconds:     10        # wait up to 10s for the HTTP check
            periodSeconds:     40        # only check every 40s
            failureThreshold:   8        # allow 8 consecutive failures before marking “Not Ready”
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 50%
