apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.appName }}
spec:
  selector:
    app: {{ .Values.appName }}
  ports:
    - protocol: TCP
      port: 80
      name: http
      targetPort: {{ .Values.port }}
    - protocol: TCP
      port: 8080
      name: grpc
      targetPort: {{ .Values.grpcPort }}